<header>

<!-- Order Form -->

<section class="form-container">

    <h2>Book Your Dream Wedding</h2>

    <form>

        <label>Full Name</label>
        <input type="text" placeholder="Enter your name">


        <label>Email Address</label>
        <input type="email" placeholder="Enter your email">


        <label>Phone Number</label>
        <input type="number" placeholder="Enter phone number">


        <label>Wedding Date</label>
        <input type="date">


        <label>Select Service</label>

        <select>

            <option>Wedding Decoration</option>
            <option>Full Wedding Planning</option>
            <option>Photography</option>
            <option>All Services Package</option>

        </select>


        <label>Your Message</label>

        <textarea rows="5" placeholder="Tell us about your wedding ideas"></textarea>


        <button type="submit">
            Submit Order
        </button>


    </form>

</section>



<!-- Packages Table -->

<section>

<h2 style="text-align:center; color:#b8860b;">
Wedding Packages
</h2>


<table>

<tr>
    <th>Package</th>
    <th>Services</th>
    <th>Price</th>
</tr>


<tr>
    <td>Basic</td>
    <td>Decoration + Flowers</td>
    <td>$500</td>
</tr>


<tr>
    <td>Premium</td>
    <td>Decoration + Photography + Planning</td>
    <td>$1000</td>
</tr>


<tr>
    <td>Luxury</td>
    <td>Complete Wedding Organization</td>
    <td>$2000</td>
</tr>


</table>


</section>
