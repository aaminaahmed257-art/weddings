<!DOCTYPE html>
<html>
<head>
    <title>Wedding Order Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="gallery.html">Gallery</a>
        <a href="order.html">Order</a>
        <a href="about.html">About</a>
        <a href="help.html">Help</a>
       
    </nav>
      <form>
    <div class="form-container">

    <h2>Wedding Order Form</h2>

  

        <label>Full Name:</label><br>
        <input type="text" placeholder="Enter your full name"><br><br>

        <label>Email:</label><br>
        <input type="email" placeholder="Enter your email"><br><br>

        <label>Phone Number:</label><br>
        <input type="tel" placeholder="Enter your phone number"><br><br>

        <label>Wedding Date:</label><br>
        <input type="date"><br><br>

        <label>Wedding Package:</label><br>
        <select>
            <option>Basic Package</option>
            <option>Silver Package</option>
            <option>Gold Package</option>
            <option>Platinum Package</option>
        </select><br><br>

        <label>Number of Guests:</label><br>
        <input type="number" min="1"><br><br>

        <label>Venue:</label><br>
        <input type="text" placeholder="Wedding venue"><br><br>

        <label>Additional Services:</label><br>
        <input type="checkbox"> Photography<br>
        <input type="checkbox"> Videography<br>
        <input type="checkbox"> Decoration<br>
        <input type="checkbox"> Catering<br><br>

        <label>Special Requests:</label><br>
        <textarea rows="5" cols="30" placeholder="Write your message"></textarea><br><br>

        <input type="submit" value="Place Order">
        <input type="reset" value="Clear">
        </div>
    </form>

</body>
</html>
